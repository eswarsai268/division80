```nginx
server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
  location /api/ { client_max_body_size 102m; proxy_pass http://api:4000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
