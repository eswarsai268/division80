# LOCAL DEVELOPMENT ONLY. Credentials below are throwaway dev values — never reuse them elsewhere.
# Secrets come from your shell / .env file (see .env.example); nothing production lives here.
services:
  tidb:
    image: pingcap/tidb:v8.5.0
    ports: ["127.0.0.1:4001:4000"]   # loopback only; host 4001 -> TiDB 4000
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  api:
    build: { context: ., target: api }
    environment: &env
      NODE_ENV: development
      DATABASE_HOST: tidb
      DATABASE_PORT: "4000"
      DATABASE_USER: root
      DATABASE_NAME: samasya_medhi
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (>=32 chars)}
      CORS_ORIGIN: http://localhost:8080
    depends_on: [tidb, redis]
    volumes: ["uploads:/data/uploads"]
    ports: ["4000:4000"]
  worker:
    build: { context: ., target: worker }
    environment: *env
    depends_on: [tidb]
  web:
    build: { context: ., target: web }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  uploads:
